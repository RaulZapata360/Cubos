<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Dashboard - TEST</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body style="padding: 40px; font-family: Arial, sans-serif;">
    <h1>✅ Login Exitoso - Dashboard de Jefe (TEMPORAL)</h1>
    <p>Si ves esta página, significa que el login funcionó correctamente.</p>

    <div id="userInfo" style="background: #f0f0f0; padding: 20px; border-radius: 8px; margin: 20px 0;">
        <h2>Información del Usuario:</h2>
        <p><strong>Cargando...</strong></p>
    </div>

    <button onclick="logout()"
        style="padding: 12px 24px; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;">
        Cerrar Sesión
    </button>

    <hr style="margin: 40px 0;">

    <p><strong>Nota:</strong> Esta es una página temporal de prueba. Una vez confirmado que el login funciona,
        volveremos a la página real de boss.html</p>

    <script type="module">
        import { authService } from './auth-service.js';

        async function loadUserInfo() {
            try {
                const session = await authService.checkSession();
                const userInfoDiv = document.getElementById('userInfo');

                if (session.authenticated) {
                    userInfoDiv.innerHTML = `
                        <h2>Información del Usuario:</h2>
                        <p><strong>Email:</strong> ${session.user.email}</p>
                        <p><strong>Nombre:</strong> ${session.profile.nombre_completo}</p>
                        <p><strong>Rol:</strong> ${session.profile.rol}</p>
                        <p><strong>ID:</strong> ${session.user.id}</p>
                        <p style="color: green; font-weight: bold;">✅ Autenticación exitosa con Supabase</p>
                    `;
                } else {
                    userInfoDiv.innerHTML = `
                        <p style="color: red;">❌ No autenticado</p>
                        <p>Redirigiendo al login...</p>
                    `;
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('userInfo').innerHTML = `
                    <p style="color: red;">❌ Error: ${error.message}</p>
                `;
            }
        }

        window.logout = async function () {
            await authService.logout();
            window.location.href = 'login.html';
        };

        loadUserInfo();
    </script>
</body>

</html>
