<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Obra - Conteo de Camiones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5048e5">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Immediate auth check to avoid flicker
        (function () {
            const hasSession = Object.keys(localStorage).some(key => key.includes('-auth-token'));
            if (!hasSession) {
                window.location.href = 'login.html';
            }
        })();
    </script>

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .selector-container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-secondary);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        .selector-header {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            padding: 32px 24px;
            text-align: center;
        }

        .selector-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: white;
        }

        .selector-header p {
            font-size: 14px;
            opacity: 0.9;
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            padding: 6px 16px 6px 6px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 99px;
            font-size: 13px;
            color: white;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-cover: cover;
            border: 2px solid white;
        }

        .selector-content {
            padding: 32px 24px;
        }

        .obras-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .obra-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .obra-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .obra-card:active {
            transform: scale(0.98);
        }

        .obra-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .obra-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .obra-detail {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .obra-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .obra-status.activa {
            background: rgba(16, 185, 129, 0.2);
            color: var(--incoming-primary);
        }

        .obra-status.pausada {
            background: rgba(251, 146, 60, 0.2);
            color: var(--outgoing-primary);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-state .hint {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .logout-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
        }

        .logout-btn:hover {
            background: var(--bg-glass);
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .loading-container {
            text-align: center;
            padding: 40px 20px;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="selector-container">
        <!-- Header -->
        <div class="selector-header">
            <h1>🏗️ Seleccionar Obra</h1>
            <p>Elige la obra en la que trabajarás hoy</p>
            <div class="user-info" id="userInfo">
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff"
                    class="user-avatar" />
                <span id="userName">Cargando...</span>
            </div>
        </div>

        <!-- Content -->
        <div class="selector-content">
            <div id="loadingContainer" class="loading-container">
                <div class="loading-spinner"></div>
                <div class="loading-text">Cargando obras asignadas...</div>
            </div>

            <div id="obrasListContainer" class="obras-list" style="display: none;">
                <!-- Obras will be populated here -->
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <p>No tienes obras asignadas</p>
                <p class="hint">Contacta a tu supervisor para que te asigne a una obra</p>
            </div>

            <button class="logout-btn" onclick="logout()">
                <span>Cerrar Sesión</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { authService } from './auth-service.js';
        import { obrasService } from './obras-service.js';

        const userNameElement = document.getElementById('userName');
        const loadingContainer = document.getElementById('loadingContainer');
        const obrasListContainer = document.getElementById('obrasListContainer');
        const emptyState = document.getElementById('emptyState');

        // Initialize
        init();

        async function init() {
            // Verify authentication
            const session = await authService.checkSession();

            if (!session.authenticated) {
                window.location.href = 'login.html';
                return;
            }

            // Verify role is contador
            if (session.rol !== 'contador') {
                authService.redirectByRole();
                return;
            }

            // Display user info from metadata or profile
            const metadata = session.user.user_metadata || {};
            const name = metadata.nombre || metadata.nombre_completo || session.profile?.nombre_completo || 'Usuario';
            const avatarUrl = metadata.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6366f1&color=fff`;

            userNameElement.textContent = name;
            document.getElementById('userAvatar').src = avatarUrl;

            // Load assigned obras
            await loadObras(session.user.id);
        }

        async function loadObras(userId) {
            try {
                const result = await obrasService.getObrasAsignadas(userId);

                loadingContainer.style.display = 'none';

                if (result.success && result.data.length > 0) {
                    renderObras(result.data);
                    obrasListContainer.style.display = 'flex';
                } else {
                    emptyState.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading obras:', error);
                loadingContainer.style.display = 'none';
                emptyState.style.display = 'block';
            }
        }

        function renderObras(obras) {
            obrasListContainer.innerHTML = obras.map(obra => `
                <div class="obra-card" onclick="selectObra('${obra.id}', '${obra.nombre}')">
                    <div class="obra-name">${obra.nombre}</div>
                    <div class="obra-details">
                        ${obra.ubicacion ? `
                            <div class="obra-detail">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                                    <circle cx="12" cy="10" r="3"/>
                                </svg>
                                ${obra.ubicacion}
                            </div>
                        ` : ''}
                        ${obra.fecha_inicio ? `
                            <div class="obra-detail">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                    <line x1="16" y1="2" x2="16" y2="6"/>
                                    <line x1="8" y1="2" x2="8" y2="6"/>
                                    <line x1="3" y1="10" x2="21" y2="10"/>
                                </svg>
                                Inicio: ${formatDate(obra.fecha_inicio)}
                            </div>
                        ` : ''}
                        <div class="obra-detail">
                            <span class="obra-status ${obra.estado}">${obra.estado}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        window.selectObra = function (obraId, obraNombre) {
            // Save selected obra
            obrasService.selectObra(obraId, obraNombre);

            // Redirect to main app
            window.location.href = 'index.html';
        };

        window.logout = async function () {
            await authService.logout();
            window.location.href = 'login.html';
        };
    </script>
</body>

</html>
