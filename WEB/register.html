<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro | Cubos V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="styles.css">
    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar-option img {
            transition: transform 0.2s;
        }

        .avatar-option:hover img {
            transform: scale(1.1);
        }

        input:focus {
            ring: 2px;
            ring-color: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
        }
    </style>
</head>

<body class="bg-[#0f172a] text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary/20 mb-4 border border-primary/30">
                <span class="material-symbols-outlined text-primary text-4xl">person_add</span>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Crear Cuenta</h1>
            <p class="text-slate-400 mt-2">Únete al sistema de gestión de Cubos</p>
        </div>

        <!-- Formulario -->
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <form id="registerForm" class="space-y-5">

                <!-- Nombre -->
                <div>
                    <label
                        class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Nombre
                        Completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez"
                        class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl text-white font-medium focus:outline-none focus:border-primary transition-all">
                </div>

                <!-- Email -->
                <div>
                    <label
                        class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Correo
                        Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com"
                        class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl text-white font-medium focus:outline-none focus:border-primary transition-all">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <!-- Rol -->
                    <div>
                        <label
                            class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Rol
                            en la Obra</label>
                        <select id="rol" name="rol" required
                            class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl text-white font-medium focus:outline-none focus:border-primary transition-all cursor-pointer">
                            <option value="contador">Contador</option>
                            <option value="supervisor">Supervisor</option>
                            <option value="secretaria">Secretario/a</option>
                        </select>
                    </div>
                    <!-- Cargo -->
                    <div>
                        <label
                            class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Cargo
                            Descriptivo</label>
                        <input type="text" id="cargo" name="cargo" placeholder="Ej: Jefe de Turno"
                            class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl text-white font-medium focus:outline-none focus:border-primary transition-all">
                    </div>
                </div>

                <!-- Contraseña -->
                <div>
                    <label
                        class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required placeholder="••••••••"
                            class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-xl text-white font-medium focus:outline-none focus:border-primary transition-all">
                        <button type="button" onclick="togglePassword()"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors">
                            <span class="material-symbols-outlined text-xl" id="passIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Selector de Avatar -->
                <div>
                    <label
                        class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 ml-1 text-center">Selecciona
                        tu Avatar</label>
                    <input type="hidden" id="avatarIcon" name="avatarIcon" value="gerente_orig">
                    <div id="avatarGalleryGrid"
                        class="grid grid-cols-4 gap-3 bg-black/30 p-4 rounded-2xl border border-white/10">
                        <!-- Se carga con JS -->
                    </div>
                </div>

                <!-- Botón de Registro -->
                <button type="submit" id="submitBtn"
                    class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-4 rounded-2xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group mt-2">
                    <span>Crear Mi Cuenta</span>
                    <span
                        class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>

                <p class="text-center text-slate-500 text-sm">
                    ¿Ya tienes cuenta? <a href="login.html" class="text-primary hover:underline font-bold">Inicia
                        sesión</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="supabase-config.js"></script>
    <script src="avatar-icons.js"></script>
    <script src="supabase-client.js" type="module"></script>

    <script type="module">
        import { supabaseClient } from './supabase-client.js';

        // 1. Cargar Galería de Avatares
        function initGallery() {
            const grid = document.getElementById('avatarGalleryGrid');
            const icons = window.AvatarIcons.getGallery();
            const currentSelected = document.getElementById('avatarIcon').value;

            grid.innerHTML = icons.map(icon => `
                <div onclick="selectAvatar('${icon.id}')" 
                     class="avatar-option cursor-pointer group relative aspect-square rounded-xl overflow-hidden border-2 transition-all ${icon.id === currentSelected ? 'border-primary ring-2 ring-primary/20' : 'border-transparent hover:border-white/20'}">
                    <img src="${icon.path}" class="w-full h-full object-contain p-1">
                </div>
            `).join('');
        }

        window.selectAvatar = function (id) {
            document.getElementById('avatarIcon').value = id;
            initGallery(); // Refrescar selección
        }

        window.togglePassword = function () {
            const input = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // 2. Manejar Registro
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span> Registrando...';

            const formData = new FormData(e.target);
            const email = formData.get('email');
            const password = formData.get('password');
            const nombre = formData.get('nombre');
            const rol = formData.get('rol');
            const cargo = formData.get('cargo');
            const avatarIcon = formData.get('avatarIcon');
            const avatarUrl = window.AvatarIcons.getUrl(avatarIcon);

            try {
                // Registro en Supabase Auth
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            nombre: nombre,
                            rol: rol,
                            cargo: cargo || rol,
                            avatarIcon: avatarIcon,
                            avatar_url: avatarUrl
                        }
                    }
                });

                if (error) throw error;

                if (data.user) {
                    alert('¡Cuenta creada con éxito! Por favor verifica tu correo (si está habilitado) o inicia sesión.');
                    window.location.href = 'login.html';
                }

            } catch (error) {
                console.error('Error de registro:', error);
                alert('Error al registrar: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>

</html>
